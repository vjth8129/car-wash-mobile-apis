# Serves the admin portal at /admin/ on the API's nginx server block (same origin as
# /api/v1, so no CORS and the existing TLS certificate covers it).
# Installed to /etc/nginx/snippets/vahanly-admin.conf by deploy/aws/remote-deploy.sh and
# included from the site's `server { ... }` blocks.

location = /admin {
    return 301 /admin/;
}

location /admin/ {
    root /var/www/carwash-admin;
    # Client-side routes (/admin/car-washes/...) fall back to the app shell.
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Vite fingerprints asset file names, so they can be cached forever.
    location /admin/assets/ {
        root /var/www/carwash-admin;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
