# Install to /etc/nginx/sites-available/carwash-api and symlink into sites-enabled.
# Run `sudo certbot --nginx -d api.yourdomain.com` afterwards - it rewrites this file
# in place to add the TLS server block and the :80 -> :443 redirect. Don't hand-add
# SSL directives here first; let certbot generate them.

server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    access_log /var/log/nginx/carwash-api.access.log;
    error_log  /var/log/nginx/carwash-api.error.log;
}
